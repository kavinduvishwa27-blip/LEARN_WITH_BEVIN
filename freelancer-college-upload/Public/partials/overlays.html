<div class="cookie" role="dialog" aria-live="polite" aria-label="Cookie preferences" data-cookie hidden>
  <p><b>Cookies, briefly.</b> We use essential cookies to run the site. With your OK we also use analytics to see which pages help people most. <a href="/legal/cookies">Details</a></p>
  <div class="cookie-actions">
    <button class="btn btn-ghost btn-sm" data-cookie-choice="essential">Essential only</button>
    <button class="btn btn-primary btn-sm" data-cookie-choice="all">Allow analytics</button>
  </div>
</div>

<div class="palette" data-palette hidden role="dialog" aria-modal="true" aria-label="Search the site">
  <div class="palette-backdrop" data-close-search></div>
  <div class="palette-box">
    <div class="palette-input">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" placeholder="Search courses, tools, articles..." aria-label="Search" data-search-input autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <ul class="palette-results" data-search-results role="listbox"></ul>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span></div>
  </div>
</div>
