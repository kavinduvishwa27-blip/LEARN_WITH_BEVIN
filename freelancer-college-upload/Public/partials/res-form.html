<div data-form-wrap>
  <form class="form" data-lead-form data-type="lead" novalidate>
    <div class="form-row">
      <div class="field"><label>Name<input name="name" autocomplete="name" required></label><span class="field-error"></span></div>
      <div class="field"><label>WhatsApp<input name="phone" inputmode="tel" autocomplete="tel" placeholder="07X XXX XXXX" required></label><span class="field-error"></span></div>
    </div>
    <div class="field"><label>Email <span class="dim">(optional)</span><input name="email" type="email" autocomplete="email"></label><span class="field-error"></span></div>
    <button class="btn btn-primary btn-block" type="submit">Send it to me <span class="arrow">→</span></button>
    <p class="form-msg" role="status" aria-live="polite"></p>
  </form>
  <div class="form-success"><div class="tick">✓</div><h3>On its way.</h3><p class="muted">Check WhatsApp and your inbox in a few minutes.</p></div>
</div>
