<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="canonical" href="{{ page.canonical }}">
  <meta name="theme-color" content="#f4f3f1">
  <meta name="color-scheme" content="light">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.brand.name }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.canonical }}">
  <meta property="og:image" content="{{ site.url }}/assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="alternate" hreflang="en" href="{{ page.canonical }}">
  <link rel="alternate" hreflang="x-default" href="{{ page.canonical }}">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..900&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <script>(function(d){d.classList.replace('no-js','js');if(!matchMedia('(prefers-reduced-motion: reduce)').matches){d.classList.add('motion-pending');setTimeout(function(){d.classList.remove('motion-pending')},3000);}})(document.documentElement);</script>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "{{ site.brand.name }}",
    "legalName": "{{ site.brand.company }}",
    "url": "{{ site.url }}",
    "logo": "{{ site.url }}/assets/img/favicon.svg",
    "email": "{{ site.contact.email }}",
    "telephone": "{{ site.contact.phone_tel }}",
    "address": { "@type": "PostalAddress", "addressLocality": "Gampaha", "addressCountry": "LK" },
    "founder": { "@type": "Person", "name": "{{ site.brand.founder }}", "jobTitle": "Founder, Fiverr Top Rated Seller" },
    "sameAs": ["{{ site.social.tiktok }}", "{{ site.social.facebook }}", "{{ site.social.youtube }}"]
  }
  </script>
</head>
<body class="{{ page.bodyclass }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>
  <div class="cursor" aria-hidden="true"><span class="cursor-dot"></span><span class="cursor-ring"></span></div>

  {{> nav }}

  <main id="main">
{{ content }}
  </main>

  {{> footer }}
  {{> overlays }}

  <div id="fc-config" hidden data-json="{{ site }}"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
